name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t picotainers/fastani:test .

      - name: Smoke test
        run: docker run --rm picotainers/fastani:test --help
